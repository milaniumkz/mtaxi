# Managed by MTaxi Git deploy
server {
 listen 80;
 server_name mtaxi.app.kz;
 location /.well-known/acme-challenge/ { root /var/www/mtaxi-acme; }
 location / { return 301 https://$host$request_uri; }
}
server {
 listen 443 ssl;
 server_name mtaxi.app.kz;
 ssl_certificate /etc/letsencrypt/live/mtaxi.app.kz/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/mtaxi.app.kz/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 root /var/www/mtaxi;
 index index.html;
 client_max_body_size 25m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location ~ ^/(call/|create-token$|readyz$|livez$|health$|uploads/|payments/) {
  proxy_pass http://127.0.0.1:8080;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
 }
 location /downloads/ { try_files $uri =404; }
 location ~ /(index.html|flutter_bootstrap.js|flutter_service_worker.js|firebase-messaging-sw.js)$ {
  add_header Cache-Control 'no-cache';
  try_files $uri =404;
 }
 location / { try_files $uri $uri/ /index.html; }
}
