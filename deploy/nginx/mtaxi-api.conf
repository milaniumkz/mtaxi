# MTaxi API reverse proxy.
# Replace api.mtaxi.kz and SSL paths before enabling on the VPS.

server {
    listen 80;
    server_name api.mtaxi.kz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.mtaxi.kz;

    ssl_certificate /etc/letsencrypt/live/api.mtaxi.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mtaxi.kz/privkey.pem;

    client_max_body_size 25m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 10s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
    }
}
