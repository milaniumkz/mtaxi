services:
  backend:
    volumes:
      - /etc/mtaxi/firebase.json:/run/secrets/firebase.json:ro
      - /etc/mtaxi/kaspi-pos.key:/run/secrets/kaspi-pos.key:ro
      - /var/lib/mtaxi/kaspi-pos:/var/lib/mtaxi/kaspi-pos
    environment:
      MTAXI_BACKUP_DIR: /var/backups/mtaxi
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
      MTAXI_KASPI_POS_KEY_FILE: /run/secrets/kaspi-pos.key
      MTAXI_KASPI_POS_STATE_DIR: /var/lib/mtaxi/kaspi-pos
