name: Check MTaxi VPS access
on:
  push:
    branches: [codex/free-staging-20261021]
    paths:
      - .github/workflows/vps-access-check.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mtaxi-vps
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: 89.126.192.185
    steps:
      - name: Check password secret
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          test -n "$SSHPASS" || { echo 'Add repository Actions secret VPS_SSH_PASSWORD'; exit 1; }
      - name: Install SSH password helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sshpass
      - name: Establish initial SSH host trust
        env:
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # First connection: record the public host key before authentication.
            ssh-keyscan -T 15 -t ed25519 "$VPS_HOST" > ~/.ssh/known_hosts
            test -s ~/.ssh/known_hosts
            echo 'Initial host key fingerprint (verify against hosting console):'
            ssh-keygen -lf ~/.ssh/known_hosts
          fi
      - name: Inspect server without changing services
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -eu
          echo 'Operating system:'
          cat /etc/os-release
          echo 'Resources:'
          free -h
          df -h /
          echo 'Listening ports:'
          ss -lnt
          echo 'Deployment prerequisites:'
          for cmd in docker nginx certbot curl tar git; do command -v "$cmd" || true; done
          if command -v docker >/dev/null; then
            docker compose version || true
            docker ps --format '{{.Names}} {{.Image}} {{.Ports}}'
          fi
          echo 'Existing deployment paths:'
          for path in /opt/mtaxi /var/www/mtaxi /etc/nginx/sites-enabled; do
            if [ -e "$path" ]; then ls -ld "$path"; fi
          done
          echo 'Domain resolution:'
          getent ahostsv4 mtaxi.app.kz || true
          echo 'SSH public host key:'
          if [ -f /etc/ssh/ssh_host_ed25519_key.pub ]; then
            printf '89.126.192.185 '
            cat /etc/ssh/ssh_host_ed25519_key.pub
          fi
          REMOTE
