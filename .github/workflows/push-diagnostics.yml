name: MTaxi push diagnostics (read only)
on:
  push:
    branches: [codex/full-audit-20261023]
    paths: [.github/workflows/push-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Count registrations and delivery outcomes without sending notifications
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
          HAS_WEB_VAPID: ${{ secrets.FIREBASE_WEB_VAPID_KEY != '' }}
        run: |
          test -n "$SSHPASS"
          echo "Web VAPID configured: $HAS_WEB_VAPID"
          sudo apt-get update -qq
          sudo apt-get install -y sshpass
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' '89.126.192.185 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDY8hkshZ0Nhs9jOJzO1aYdJqf2UjZHqpvlnAKDV552G' > ~/.ssh/known_hosts
          sshpass -e ssh -o StrictHostKeyChecking=yes root@89.126.192.185 'cd /opt/mtaxi && docker compose -p mtaxi -f docker-compose.production.yml -f deploy/vps.compose.yml exec -T backend node -' < server/scripts/push_diagnostics.js
