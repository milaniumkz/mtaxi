name: Deploy and publish MTaxi test app
on:
  push:
    branches: [codex/free-staging-20261021]
    paths: [.github/workflows/activate-vps.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mtaxi-vps
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_URL: https://mtaxi.89.126.192.185.sslip.io
      VPS_HOST: 89.126.192.185
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare pinned SSH connection
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y sshpass
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' '89.126.192.185 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDY8hkshZ0Nhs9jOJzO1aYdJqf2UjZHqpvlnAKDV552G' > ~/.ssh/known_hosts
      - name: Activate PostgreSQL backend and real FCM
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: sshpass -e ssh -o StrictHostKeyChecking=yes "root@$VPS_HOST" 'bash -s' < deploy/activate_vps.sh
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.41.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 90673a4eef275d1a6692c26ac80d6d746d41a73a
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate application and build web
        run: |
          npm ci --prefix server
          npm test --prefix server
          flutter pub get --enforce-lockfile
          flutter test --no-pub
          flutter analyze --no-pub
          flutter build web --no-pub --no-web-resources-cdn --dart-define=MTAXI_REQUIRE_REMOTE_BACKEND=true --dart-define="MTAXI_BACKEND_URL=$APP_URL"
          tar -czf "$RUNNER_TEMP/web.tar.gz" -C build/web .
      - name: Publish web version
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=yes "$RUNNER_TEMP/web.tar.gz" "root@$VPS_HOST:/opt/mtaxi-incoming/web.tar.gz"
          sshpass -e ssh -o StrictHostKeyChecking=yes "root@$VPS_HOST" 'tar -xzf /opt/mtaxi-incoming/web.tar.gz -C /var/www/mtaxi && find /var/www/mtaxi -type d -exec chmod 755 {} + && find /var/www/mtaxi -type f -exec chmod 644 {} +'
          curl --fail --silent --output /dev/null "$APP_URL/"
          curl --fail --silent --output /dev/null "$APP_URL/admin"
      - name: Build phone APK against live HTTPS backend
        run: bash scripts/build_test_apk.sh "$APP_URL"
      - name: Publish APK and checksum
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=yes "root@$VPS_HOST" 'install -d -m 755 /var/www/mtaxi/downloads'
          sshpass -e scp -o StrictHostKeyChecking=yes output/mtaxi-staging.apk output/mtaxi-staging.apk.sha256 "root@$VPS_HOST:/var/www/mtaxi/downloads/"
          sshpass -e ssh -o StrictHostKeyChecking=yes "root@$VPS_HOST" 'chmod 644 /var/www/mtaxi/downloads/*'
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$apksigner_bin" verify output/mtaxi-staging.apk
          curl --fail --head "$APP_URL/downloads/mtaxi-staging.apk"
          printf 'Web: %s/\nAdmin: %s/admin\nAPK: %s/downloads/mtaxi-staging.apk\n' "$APP_URL" "$APP_URL" "$APP_URL" >> "$GITHUB_STEP_SUMMARY"
