name: Deploy audited MTaxi and publish APK
# Deploy passenger route form with both addresses visible; preserve uploads and signing identity.
on:
  push:
    branches: [codex/full-audit-20261023]
    paths: [.github/workflows/activate-vps.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mtaxi-vps
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      APP_URL: https://mtaxi.89.126.192.185.sslip.io
      VPS_HOST: 89.126.192.185
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare pinned SSH connection
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y sshpass
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' '89.126.192.185 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDY8hkshZ0Nhs9jOJzO1aYdJqf2UjZHqpvlnAKDV552G' > ~/.ssh/known_hosts
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.41.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 90673a4eef275d1a6692c26ac80d6d746d41a73a
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate application and build web
        run: |
          npm ci --prefix server
          MTAXI_FCM_ENABLED=false npm test --prefix server
          flutter pub get --enforce-lockfile
          flutter test --no-pub
          flutter analyze --no-pub
          flutter build web --no-pub --no-web-resources-cdn --dart-define=MTAXI_REQUIRE_REMOTE_BACKEND=true --dart-define="MTAXI_BACKEND_URL=$APP_URL"
          tar -czf "$RUNNER_TEMP/web.tar.gz" -C build/web .
      - name: Preserve test APK signing key between builds
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          umask 077
          mkdir -p ~/.android
          if sshpass -e ssh -o StrictHostKeyChecking=yes "root@$VPS_HOST" 'test -f /etc/mtaxi/test-debug.keystore'; then
            sshpass -e scp -o StrictHostKeyChecking=yes "root@$VPS_HOST:/etc/mtaxi/test-debug.keystore" ~/.android/debug.keystore
          else
            echo "Existing signing key missing; refusing to create a replacement" >&2
            exit 1
          fi
      - name: Build phone APK against live HTTPS backend
        run: bash scripts/build_test_apk.sh "$APP_URL"
      - name: Back up, deploy audited revision and publish web and APK
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=yes "root@$VPS_HOST" 'install -d -m 755 /var/www/mtaxi/downloads && install -d -m 700 /opt/mtaxi-incoming'
          node -e 'const fs=require("fs");const version=JSON.parse(fs.readFileSync("build/web/version.json","utf8"));fs.writeFileSync("output/test-build.json",JSON.stringify({...version,revision:process.env.GITHUB_SHA,apkSha256:fs.readFileSync("output/mtaxi-staging.apk.sha256","utf8").trim().split(/\s+/)[0],publishedAt:new Date().toISOString()}));'
          sshpass -e scp -o StrictHostKeyChecking=yes deploy/publish_test_apk.sh output/test-build.json output/mtaxi-staging.apk output/mtaxi-staging.apk.sha256 "root@$VPS_HOST:/opt/mtaxi-incoming/"
          sshpass -e scp -o StrictHostKeyChecking=yes "$RUNNER_TEMP/web.tar.gz" deploy/deploy_audited.sh "root@$VPS_HOST:/opt/mtaxi-incoming/"
          sshpass -e ssh -o StrictHostKeyChecking=yes "root@$VPS_HOST" "bash /opt/mtaxi-incoming/deploy_audited.sh '$GITHUB_SHA'"
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$apksigner_bin" verify output/mtaxi-staging.apk
          curl --fail --head "$APP_URL/downloads/mtaxi-staging.apk"
          printf 'Web: %s/\nAdmin: %s/admin\nAPK: %s/downloads/mtaxi-staging.apk\n' "$APP_URL" "$APP_URL" "$APP_URL" >> "$GITHUB_STEP_SUMMARY"
