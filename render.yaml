# Disposable staging only. No paid compute plans or persistent disks.
databases:
  - name: mtaxi-test-db
    plan: free
    region: frankfurt
    databaseName: mtaxi
    user: mtaxi

services:
  - type: web
    name: mtaxi-test-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./server
    dockerfilePath: ./server/Dockerfile
    dockerCommand: node scripts/start_render_staging.js
    healthCheckPath: /readyz
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: MTAXI_STORE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: mtaxi-test-db
          property: connectionString
      - key: MTAXI_TOKEN_SECRET
        generateValue: true
      - key: MTAXI_PAYMENT_CALLBACK_SECRET
        generateValue: true
      - key: MTAXI_PAYMENT_PROVIDER
        value: kaspi_manual
      - key: MTAXI_SMS_PROVIDER
        value: disabled
      - key: MTAXI_FCM_ENABLED
        value: "true"
      - key: MTAXI_ALLOW_SIMULATED_PUSH
        value: "false"
      - key: FIREBASE_PROJECT_ID
        value: mtaxi-52990
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: MTAXI_ADMIN_PHONE
        sync: false
      - key: MTAXI_ADMIN_PASSWORD
        generateValue: true
      - key: MTAXI_ADMIN_NAME
        value: Администратор тестового стенда
      - key: MTAXI_ADMIN_CITY
        value: Жетекши
      - key: MTAXI_SEED_ADMIN_ON_START
        value: "true"
      - key: MTAXI_TRUST_PROXY
        value: "1"
      - key: MTAXI_ALLOW_LOCAL_PUBLIC_BASE_URL
        value: "false"
      - key: MTAXI_ALLOW_INSECURE_PUBLIC_BASE_URL
        value: "false"
      - key: MTAXI_ALLOW_LOCAL_SMS
        value: "false"
      - key: MTAXI_SMS_DEV_RETURN_CODE
        value: "false"
      - key: MTAXI_ALLOW_LOCAL_PAYMENT
        value: "false"
      - key: MTAXI_ENABLE_LEGACY_CREATE_TOKEN
        value: "false"
      - key: MTAXI_MAINTENANCE_INTERVAL_SEC
        value: "30"
      - key: MTAXI_UPLOAD_DIR
        value: /var/lib/mtaxi/uploads

  - type: web
    name: mtaxi-test-web
    runtime: static
    buildCommand: bash scripts/build_render_web.sh
    staticPublishPath: ./build/web
    autoDeployTrigger: "off"
    envVars:
      - key: MTAXI_BACKEND_HOST
        fromService:
          name: mtaxi-test-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /flutter_bootstrap.js
        name: Cache-Control
        value: no-cache
